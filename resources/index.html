<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zircon</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main id="neutralinoapp">
        <section class="signin-panel" aria-labelledby="signin-title">
            <h1 id="signin-title"><img src="icons/appIcon.png" alt="Zircon Logo"></h1>
            <form id="signin-form">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>

                <button type="submit">Sign in</button>
                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="js/neutralino.js"></script>
    <script src="js/sign_in.js"></script>
</body>

</html>
